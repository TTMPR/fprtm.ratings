name: FPTM admin HTML security regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject unescaped user-submitted admin HTML
        run: node --test tests/security-admin-html.node.cjs
      - name: Validate membership renewal form and secure directory contract
        run: node --test tests/membership-renewal.node.cjs
