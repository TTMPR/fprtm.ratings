<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin · TTM PR</title>
<link rel="icon" href="ttm_pr_favicon_32x32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070b13;color:#f7f8fb;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
main{max-width:380px;width:100%;padding:30px;background:#0d121d;border:1px solid #202838;border-radius:18px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
header img{width:125px;height:auto}a{color:#9aa5b6;text-decoration:none;font-size:12px}
h1{font-size:23px;letter-spacing:-.03em;margin:0 0 8px}p{color:#9aa5b6;line-height:1.5;margin:0 0 24px}
label{display:block;margin:16px 0 7px;font-size:12px;color:#c8d0dc;font-weight:650}
input{display:block;width:100%;background:#080d16;border:1px solid #303b4c;border-radius:10px;color:white;padding:12px;font:inherit}
input:focus{outline:2px solid #00e5c0;outline-offset:2px}
button{width:100%;background:#00e5c0;color:#04110f;font:700 14px system-ui;border:0;border-radius:10px;padding:13px;margin-top:22px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#message{margin-top:15px;color:#ff8c9a;min-height:17px;font-size:12px}
</style>
</head>
<body>
<main>
<header><img src="ttm_pr_logo_dark_transparent.png" alt="TTM PR"><a href="index.html">Volver</a></header>
<h1>Administración</h1>
<p>Acceso privado para revisar y aprobar solicitudes de membresía y renovación.</p>
<form id="loginForm">
<label for="email">Correo electrónico</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Entrar</button>
<div id="message" role="alert" aria-live="polite"></div>
</form>
</main>
<script>
const supabaseClient=window.supabase.createClient(
 'https://qrvyfdpwtearfpjruwja.supabase.co',
 'sb_publishable_mM59efPqpcgrR3g3_6F_Ww_h1jg4PyV'
);
const ADMIN_UID='b1c91ed0-edc2-42ea-b64e-346a0659dcad';
const goToMemberships=()=>location.replace('legacy.html#membresia');
(async()=>{
 try{
  const {data,error}=await supabaseClient.auth.getUser();
  if(!error&&data.user?.id===ADMIN_UID)goToMemberships();
 }catch(e){/* Keep login visible when no session exists. */}
})();
document.getElementById('loginForm').addEventListener('submit',async event=>{
 event.preventDefault();
 const btn=document.getElementById('submit'),msg=document.getElementById('message');
 btn.disabled=true;btn.textContent='Verificando...';msg.textContent='';
 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  document.getElementById('password').value='';
  if(error)throw new Error('No se pudo iniciar sesión. Verifica tus credenciales.');
  const {data,error:verifyError}=await supabaseClient.auth.getUser();
  if(verifyError||data.user?.id!==ADMIN_UID){
   await supabaseClient.auth.signOut();
   throw new Error('Esta cuenta no tiene acceso administrativo.');
  }
  goToMemberships();
 }catch(err){msg.textContent=err.message||'No se pudo iniciar sesión.';}
 finally{btn.disabled=false;btn.textContent='Entrar';}
});
</script>
</body>
</html>
